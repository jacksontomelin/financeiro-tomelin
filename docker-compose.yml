services:
  app:
    build: .
    container_name: tomelin-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_NOME: ${ADMIN_NOME:-Jackson Tomelin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tomelin.com.br}
      ADMIN_SENHA: ${ADMIN_SENHA:-tomelin123}
      WHATSAPP_ATIVO: ${WHATSAPP_ATIVO:-false}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_GRUPO: ${WHATSAPP_GRUPO:-}
      RECIBO_WHATSAPP_AUTO: ${RECIBO_WHATSAPP_AUTO:-true}
      ALERTA_HORA: ${ALERTA_HORA:-8}
      ALERTA_DIAS_ANTES: ${ALERTA_DIAS_ANTES:-3}
      RESUMO_SEMANAL: ${RESUMO_SEMANAL:-true}
      FECHAMENTO_DIARIO: ${FECHAMENTO_DIARIO:-true}
      FECHAMENTO_HORA: ${FECHAMENTO_HORA:-20}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      FIPE_ATIVO: ${FIPE_ATIVO:-false}
      FIPE_API_URL: ${FIPE_API_URL:-}
      FIPE_API_TOKEN: ${FIPE_API_TOKEN:-}
      EMPRESA_NOME: ${EMPRESA_NOME:-Tomelin Gestão Financeira}
      EMPRESA_CIDADE: ${EMPRESA_CIDADE:-Blumenau/SC}
    ports:
      - "8000:8000"
