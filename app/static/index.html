<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082D51">
<title>Tomelin Gestão Financeira</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/static/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/static/styles.css?v=116-1790860861">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("tom_tema")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div class="toast-wrap" id="toasts"></div>
<script>
  /* Se o app.js quebrar antes de desenhar, mostra o erro em vez de tela branca */
  window.__bootErro = function (msg) {
    var r = document.getElementById("root");
    if (r && !r.innerHTML.trim()) r.innerHTML =
      '<div style="font-family:system-ui;max-width:520px;margin:60px auto;padding:24px;border:1px solid #FCA5A5;border-radius:14px;background:#FEF2F2;color:#7F1D1D">' +
      '<b>O sistema não conseguiu carregar.</b><br><br>Erro: <code>' + String(msg).replace(/</g,"&lt;") + '</code>' +
      '<br><br><button onclick="(navigator.serviceWorker?navigator.serviceWorker.getRegistrations():Promise.resolve([])).then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>caches.keys()).then(k=>Promise.all(k.map(c=>caches.delete(c)))).then(()=>location.replace(location.pathname+&quot;?r=&quot;+Date.now()))" ' +
      'style="padding:8px 14px;border:0;border-radius:8px;background:#082D51;color:#fff;cursor:pointer">Limpar cache e recarregar</button></div>';
  };
  window.addEventListener("error", function (e) { window.__bootErro(e.message); });
</script>
<script src="/static/app.js?v=116-1790860861"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").then((reg) => {
        reg.update().catch(()=>{});
        // Se achou atualização, aplica imediatamente sem esperar
        reg.addEventListener("updatefound", () => {
          const w = reg.installing;
          if (w) w.addEventListener("statechange", () => {
            if (w.state === "installed" && navigator.serviceWorker.controller) {
              w.postMessage({ type: "SKIP_WAITING" });
              window.location.reload();
            }
          });
        });
      }).catch(()=>{});
      // Controller mudou = SW novo ativo: recarrega
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!refreshing) { refreshing = true; window.location.reload(); }
      });
    });
    // Quando um novo Service Worker assume o controle (nova versão publicada),
    // recarrega a página automaticamente para o usuário ver a versão mais nova.
    let recarregando = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (recarregando) return;
      recarregando = true;
      window.location.reload();
    });
  }
</script>
</body>
</html>
