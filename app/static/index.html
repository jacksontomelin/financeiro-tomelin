<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082D51">
<title>Tomelin Gestão Financeira</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/static/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/static/styles.css?v=146-1791208928">
<link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tomelin">
<meta name="application-name" content="Tomelin">
<meta name="format-detection" content="telephone=no">
<script>try{if(localStorage.getItem("tom_tema")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div class="toast-wrap" id="toasts"></div>
<script>
  /* Se o app.js quebrar antes de desenhar, mostra o erro em vez de tela branca */
  window.__bootErro = function (msg) {
    var r = document.getElementById("root");
    if (r && !r.innerHTML.trim()) r.innerHTML =
      '<div style="font-family:system-ui;max-width:520px;margin:60px auto;padding:24px;border:1px solid #FCA5A5;border-radius:14px;background:#FEF2F2;color:#7F1D1D">' +
      '<b>O sistema não conseguiu carregar.</b><br><br>Erro: <code>' + String(msg).replace(/</g,"&lt;") + '</code>' +
      '<br><br><button onclick="(navigator.serviceWorker?navigator.serviceWorker.getRegistrations():Promise.resolve([])).then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>caches.keys()).then(k=>Promise.all(k.map(c=>caches.delete(c)))).then(()=>location.replace(location.pathname+&quot;?r=&quot;+Date.now()))" ' +
      'style="padding:8px 14px;border:0;border-radius:8px;background:#082D51;color:#fff;cursor:pointer">Limpar cache e recarregar</button></div>';
  };
  window.addEventListener("error", function (e) { window.__bootErro(e.message); });
</script>
<script src="/static/app.js?v=146-1791208928"></script>
<script>
  if ("serviceWorker" in navigator) {
    // Só recarrega quando uma versão NOVA assume (atualização publicada).
    // Na primeira instalação não: antes a página recarregava sozinha logo depois
    // de abrir e quem estava digitando o login perdia a tentativa.
    const jaTinha = !!navigator.serviceWorker.controller;
    let recarregando = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!jaTinha || recarregando) return;
      recarregando = true;
      window.location.reload();
    });
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").then((reg) => {
        reg.update().catch(()=>{});
        reg.addEventListener("updatefound", () => {
          const w = reg.installing;
          if (w) w.addEventListener("statechange", () => {
            if (w.state === "installed" && navigator.serviceWorker.controller) w.postMessage({ type: "SKIP_WAITING" });
          });
        });
      }).catch(()=>{});
    });
  }
</script>
</body>
</html>
