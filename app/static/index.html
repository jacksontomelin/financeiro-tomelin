<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082D51">
<title>Tomelin Gestão Financeira</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/static/icons/favicon-48.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/static/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("tom_tema")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div class="toast-wrap" id="toasts"></div>
<script src="/static/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").then((reg) => {
        // Verifica por atualização assim que registra
        reg.update().catch(()=>{});
      }).catch(()=>{});
    });
    // Quando um novo Service Worker assume o controle (nova versão publicada),
    // recarrega a página automaticamente para o usuário ver a versão mais nova.
    let recarregando = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (recarregando) return;
      recarregando = true;
      window.location.reload();
    });
  }
</script>
</body>
</html>
